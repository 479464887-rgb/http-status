<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Http Status — DevKit Tools</title><meta name="description" content="HTTP 状态码速查表 - 所有状态码及含义"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:18px;font-weight:700;color:#58a6ff}.logo span{color:#f0c040}main{max-width:700px;margin:32px auto;padding:0 24px;flex:1}footer{padding:16px 24px;border-top:1px solid #21262d;text-align:center;font-size:12px;color:#484f58}footer a{color:#58a6ff;text-decoration:none;margin:0 8px}.ta{width:100%;padding:16px;font-size:13px;border:1px solid #30363d;border-radius:8px;background:#0d1117;color:#c9d1d9;resize:vertical;outline:none;font-family:mono;line-height:1.6}.ta:focus{border-color:#58a6ff}.btn{padding:10px 24px;font-size:13px;font-weight:600;border:1px solid #30363d;border-radius:8px;cursor:pointer;background:#21262d;color:#c9d1d9}.btn:hover{background:#30363d}.btn-p{background:#238636;border-color:#238636;color:#fff}.btn-p:hover{background:#2ea043}.actions{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin:12px 0}</style></head><body><header><div class="logo">🛠 <span>Dev</span>Kit</div><div style="font-size:11px;color:#8b949e">🔒 Processed locally · 数据不Upload</div></header><main><h1 style="font-size:24px;margin-bottom:4px">HTTP Status Codes</h1><p style="color:#8b949e;font-size:14px;margin-bottom:16px">HTTP 状态码速查表 - 所有状态码及含义</p><div class="tool-wrapper"><div class="actions"><input id="hs-search" placeholder="Search状态码..." style="flex:1;padding:10px;font-size:14px;border:1px solid #30363d;border-radius:8px;background:#0d1117;color:#c9d1d9;outline:none"></div><div id="hs-list" style="display:grid;gap:4px"></div></div></main><footer><a href="https://github.com/479464887-rgb/http-status">GitHub</a><span>·</span><span>© 2026 DevKit</span></footer><script>const codes='100 Continue;101 Switching Protocols;200 OK;201 Created;204 No Content;301 Moved Permanently;302 Found;304 Not Modified;400 Bad Request;401 Unauthorized;403 Forbidden;404 Not Found;405 Method Not Allowed;429 Too Many Requests;500 Internal Server Error;502 Bad Gateway;503 Service Unavailable;504 Gateway Timeout'.split(';');function render(f){document.getElementById('hs-list').innerHTML=codes.filter(c=>!f||c.toLowerCase().includes(f)).map(c=>{const p=c.split(' ');const n=p.shift();const t=p.join(' ');const s=n[0];const colors={1:'#8b949e',2:'#3fb950',3:'#58a6ff',4:'#d29922',5:'#f85149'};return'<div style="display:flex;gap:12px;padding:8px 12px;background:#161b22;border:1px solid #30363d;border-radius:6px;font-family:mono;font-size:13px"><span style="color:'+colors[s]+';font-weight:700;min-width:40px">'+n+'</span><span>'+t+'</span></div>'}).join('')}render();document.getElementById('hs-search').addEventListener('input',function(){render(this.value.toLowerCase())})</script></body></html>
